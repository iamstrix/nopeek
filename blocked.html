<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="blocked.css">
</head>

<body>
  <!-- Ambient background glow -->
  <div class="ambient"></div>
  <div class="ambient-secondary"></div>

  <main class="container">
    <div class="shield">
      <!-- The shutter, closed. Same mark as the toolbar, drawn larger. -->
      <svg width="54" height="54" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <rect x="4" y="4" width="16" height="4.1" rx="1.5" />
        <rect x="4" y="9.1" width="16" height="2.6" rx="0.4" />
        <rect x="4" y="12.7" width="16" height="1.8" rx="0.4" />
        <rect x="4" y="15.5" width="16" height="1.1" rx="0.4" />
        <rect x="4" y="17.6" width="16" height="2.4" rx="1.5" />
      </svg>
    </div>

    <h1>You set this boundary for a reason.</h1>

    <p class="subtext" id="tally">
      Blocked by Nopeek.<br>
      Take a breath. You're doing fine.
    </p>

    <div class="actions">
      <button id="goBackBtn" class="btn btn-secondary">Go Back</button>
      <button id="closeTabBtn" class="btn btn-primary">Close Tab</button>
    </div>

    <p class="footnote">Unblocking happens in the toolbar, not here.</p>
  </main>

  <script type="module" src="blocked.js"></script>
</body>

</html>
