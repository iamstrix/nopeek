<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="blocked.css">
</head>

<body>
  <!-- Ambient background glow -->
  <div class="ambient"></div>
  <div class="ambient-secondary"></div>

  <main class="container">
    <div class="shield">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <line x1="9" y1="9" x2="15" y2="15" />
        <line x1="15" y1="9" x2="9" y2="15" />
      </svg>
    </div>

    <h1>You set this boundary for a reason.</h1>

    <p class="subtext" id="tally">
      This page has been blocked by Nopeek.<br>
      Take a deep breath. You're doing the right thing.
    </p>

    <div class="actions">
      <button id="goBackBtn" class="btn btn-secondary">Go Back</button>
      <button id="closeTabBtn" class="btn btn-primary">Close Tab</button>
    </div>

    <p class="footnote">Unblocking lives behind the Nopeek toolbar icon — not here.</p>
  </main>

  <script type="module" src="blocked.js"></script>
</body>

</html>
