<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
        <div>
          <h1>Nopeek</h1>
        </div>
      </div>
    </header>

    <!-- URL Input -->
    <div class="input-group">
      <input type="url" id="urlInput" placeholder="Paste a URL to block…" autocomplete="off" spellcheck="false">
      <button id="addBtn" class="btn-add" title="Block this URL">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <!-- Feedback toast -->
    <div id="feedback" class="feedback hidden"></div>

    <!-- List header -->
    <div class="list-header">
      <span class="list-title">Blocked URLs</span>
      <span id="count" class="count">0</span>
    </div>

    <!-- URL List -->
    <div id="urlList" class="url-list">
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
            <circle cx="12" cy="12" r="10" />
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
          </svg>
        </div>
        <p>No URLs blocked yet</p>
        <p class="empty-sub">Paste a URL above to get started</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
